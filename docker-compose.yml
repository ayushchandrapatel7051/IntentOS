# ==========================================
# IntentOS — Docker Compose
# ==========================================
# Services:
#   intentos-backend   — FastAPI + Pi Engine agent (Python)
#   intentos-frontend  — React dashboard (nginx)
#   intentos-whatsapp  — WhatsApp bridge (Node.js)
#
# Usage:
#   docker compose up -d              # start all
#   docker compose up -d backend      # start backend only
#   docker compose logs -f backend    # live logs
#   docker compose down               # stop all
# ==========================================

services:

  # ── Backend: FastAPI + Pi Engine Agent ──
  intentos-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: intentos/backend:latest
    container_name: intentos-backend
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"
    volumes:
      # Persist memory and logs across container restarts
      - intentos-memory:/app/memory
      - intentos-logs:/app/logs
      - intentos-screenshots:/app/screenshots
      # Mount credentials for Vertex AI (read-only)
      - ./credentials.json:/app/credentials.json:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - intentos-net

  # ── Frontend: React Dashboard via nginx ──
  intentos-frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: intentos/frontend:latest
    container_name: intentos-frontend
    restart: unless-stopped
    ports:
      - "${DASHBOARD_FRONTEND_PORT:-3000}:3000"
    depends_on:
      intentos-backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/" ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - intentos-net

  # ── WhatsApp: Node.js Bridge (optional) ──
  intentos-whatsapp:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    image: intentos/whatsapp:latest
    container_name: intentos-whatsapp
    restart: unless-stopped
    command: node skills/messaging/whatsapp_adapter.js
    volumes:
      - intentos-whatsapp-auth:/app/whatsapp-auth
    depends_on:
      intentos-backend:
        condition: service_healthy
    profiles:
      - whatsapp
    networks:
      - intentos-net

networks:
  intentos-net:
    driver: bridge
    name: intentos-net

volumes:
  intentos-memory:
    name: intentos-memory
  intentos-logs:
    name: intentos-logs
  intentos-screenshots:
    name: intentos-screenshots
  intentos-whatsapp-auth:
    name: intentos-whatsapp-auth
