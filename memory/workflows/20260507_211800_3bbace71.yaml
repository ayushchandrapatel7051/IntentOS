      \ Design Interview – An insider's guide by Alex Xu \n• System Design in a Hurry\
      \ by me & Stefan\n• Jordan Has No Life Y ouTube Channel \n1. Decide on a framework.\
      \ Thinking on your feet during an interview is hard. Y ou want to do all you\
      \ can to have \na game plan going in via a framework you've practiced. There\
      \ are a number of frameworks online, all of which \nare similar. I recommend\
      \ this to candidates, but you'll find what works for you. The goal is to keep\
      \ you focused \nand give you the structure to not get lost in the complexity\
      \ in the short time window.\n2. Choose a question to practice. Y ou'll want\
      \ to choose a question that has an answer key. This could be a \nquestion from\
      \ Hello Interview Common Problems (I am biased, but think these are the best\
      \ quality and most \ncandidates agree) or from another good resource like System\
      \ Design Fight Club.\n3. Read the requirements to understand the system you\
      \ need to design. If your answer key is a video, watch \njust the start to understand\
      \ the problem. If it's a blog post, read only the beginning until you get the\
      \ picture.\n4. Try it! Head over to a real whiteboard or open up a virtual whiteboard\
      \ like Excalidraw. Start a timer for 35-50 \nminutes depending on how long the\
      \ interview is at your target company (remember, 45 minute interviews are \n\
      just 35 minutes since 5 minutes on either side is reserved for intros and questions\
      \ respectively). In the allotted \ntime, answer the question like it was a real\
      \ interview. Don't cheat! If you don't know something, just jot it down \non\
      \ the board and keep moving.\n5. Research what you didn't know. Once the time\
      \ is up, chances are you have a long list of things you weren't \nsure about.\
      \ These are the \"known unknowns,\" or the things you know you did not know.\
      \ Head over to ChatGPT \nor Google and start proactively filling in these gaps.\
      \ Research that which you were unsure about to close the \ngaps.\n6. Read the\
      \ answer key. Only now should you actually read the answer key! Go back to that\
      \ initial blog or \nY ouTube video and read/watch it in full. This will fill\
      \ the gaps on the \"unknown unknowns,\" or the things you did \nnot know you\
      \ did not know. Having just struggled through the problem, the answer key will\
      \ now click and be \nretained at a rate 10x that of had you just read the guide\
      \ from the start.\n7. Rinse and repeat! Keep doing this same process with different\
      \ questions until you start to feel confident and \ncomfortable.\n(optional)\
      \ 8. Mock Interview. Again, acknowledging my bias here as someone who runs a\
      \ mock interview \nplatform. But, even if you don't use Hello Interview, the\
      \ mock is your chance to take all that you've learned and \n\n--- Page 2 ---\n\
      put it to the test. Y ou can have a real interviewer from your target company\
      \ interview you so you can see exactly \njust how ready you are and then adjust\
      \ your preparation based on the feedback.\nCommon Questions\nQ: Do I need to\
      \ read DDIA?   A: No, it's a great resource. But far too dense and has way more\
      \ information than \nyou need for an interview. If you have endless time, go\
      \ for it, but most don't and their are better ways to study.\nQ: What is the\
      \ biggest mistakes you see candidates make?   A: They spend all their time passively\
      \ consuming \ncontent, either videos or books, and not nearly enough time actually\
      \ trying themselves. Y ou learn by doing so \nmuch quicker than by reading passively.\n\
      Q: What are the types of problems I should practice?   A: Just like with coding\
