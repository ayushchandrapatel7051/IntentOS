      \n\nSource: ESPN cricinfo, 21 January 2026\n\n\nSignature\n\n\nVirat Kohli[a]\
      \ (born 5 November 1988) is an Indian international cricketer and the former\
      \ all-format captain of the Indian national cricket team.[3] He is a right-handed\
      \ batter and occasional right-arm medium pace bowler. Considered one of the\
      \ greatest all-format batsmen in the history of cricket, he has been acclaimed\
      \ for his batting skills, records and ability to lead his team to victory.[4]\
      \ Kohli has the most centuries in ODIs and the second-most centuries in international\
      \ cricket with 85 tons across all formats. He is also the leading run-scorer\
      \ in the Indian Premier League.[5] Kohli is the most successful Test captain\
      \ of India with most wins and 3 consecutive Test mace retainments.[6] He is\
      \ the only batter to earn 900+ rating points across all 3 formats.[7]\n\nKohli\
      \ was the captain of the 2008 U19 World Cup winning team and was a crucial member\
      \ of the teams that won 2011 ODI World Cup, 2013 Champions Trophy, 2024 T20\
      \ World Cup, and 2025 Champions Trophy. He plays for Royal Challengers Bengaluru\
      \ in the Indian Premier League and for Delhi in domestic cricket. In 2013, Kohli\
      \ was ranked number one in the ODI batting rankings. In 2015, he achieved the\
      \ same in T20I.[8] In 2018, he was ranked number one in Test, making him the\
      \ only Indian to hold the number one spot in all three formats. He is the first\
      \ player to score 20,000 runs in a decade. He was the Cricketer of the Decade\
      \ for 2011 to 2020.[9]\n\nKohli has won ten ICC Awards, making him the most\
      \ awarded player in international cricket history. He won the ODI Player of\
      \ the Year award four times in 2012, 2017, 2018, and 2023. He won the Cricketer\
      \ of the Year award, on two occasions, in 2017 and 2018. In 2018, he became\
      \ the first player to win all three major awards including Cricketer of the\
      \ Year, ODI Player of the Year and Test Player of the Year in the same year.\
      \ He was honored with the Spirit of Cricket Award in 2019 and given the Cricketer\
      \ of the Decade and ODI Cricketer of the Decade in 2020. Kohli was named the\
      \ Wisden Leading Cricketer in the World for three consecutive years.\n\nKohli\
      \ has the most Player of the Series and second most Player of the Match awards\
      \ to his name in all three formats combined. He was honoured with the Arjuna\
      \ Award in 2013, the Padma Shri in 2017, and India's highest sporting honour,\
      \ the Khel Ratna Award, in 2018. Time included him on its 100 most influential\
      \ people in the world list in 2018. Kohli has been deemed one of the most commercially\
      \ viable athletes, with estimated earnings of ₹634 crore (US$67 million) in\
      \ the year 2022.\n\nAfter winning the 2024 T20 World Cup and winning the Player\
      \ of the Match award in the final, Kohli announced his retirement from T20Is.[10]\
      \ On 12 May 2025, aged 36, he announced his retirement from the Test format.[11]\
      \ He is married to actress Anushka Sharma, and they have two children named\
      \ Vamika and Akaay Kohli.[12]\n\nEarly life\n\nKohli was born on 5 November\
      \ 1988 in New Delhi into a Punjabi Hindu family. His mother Saroj Kohli is a\
      \ homemaker while his father Prem Nath Kohli worked as a criminal lawyer. He\
      \ has an elder brother Vikas and an elder sister Bhawna. His formative years\
      \ were spent in Uttam Nagar. His early education was at Vishal Bharti Public\
      \ School.[13] As per his family, Kohli exhibited an early affinity for cricket\
      \ as a 3-year-old. He would pick up a bat and request his father bowl to him.[14]\
      \ In 1998, the West Delhi Cricket Academy was created. In May, his father arranged\
      \ for him to meet Rajkumar Sharma.[15] Upon the suggestion of their neighbours,\
      \ Kohli's father considered enrolling his son in a professional cricket academy,\
      \ as they believed his ability merited more than gully cricket.[16]\n\nKohli\
      \ was unable to secure a place in the U-14 Delhi team, due to extraneous factors.\
      \ His father reportedly received offers to relocate his son to influential clubs,\
      \ which would ensure his selection, but he declined the proposals. Kohli eventually\
      \ found his way into the U-15 team.[17] He received training at the academy\
      \ and participated in matches at the Sumeet Dogra Academy located at Vasundhara\
      \ Enclave.[18] To further his cricket career, he transferred to Saviour Convent\
      \ School during his ninth grade.[16] On 18 December 2006, his father died due\
      \ to a cerebral attack.[19] As per his mother, Kohli's demeanour shifted noticeably\
      \ after his father's death. He took on cricket with newfound seriousness, prioritizing\
      \ playing time and dedicating himself fully to the sport.[16] Kohli's family\
      \ resided in Meera Bagh, Paschim Vihar until 2015, after which they relocated\
      \ to Gurgaon.[20]\n\nYouth career\nDelhi team\n\nKohli's junior cricket career\
      \ kicked off in October 2002 at the Luhnu Cricket Ground against Himachal Pradesh.\
      \ His first half-century in domestic cricket happened at Feroze Shah Kotla,\
      \ where he scored 70 runs against Haryana.[21] By the end of the season, he\
      \ had amassed a total of 172 runs, emerging as the highest run-scorer for his\
      \ team with an average of 34.40.[22] During the 2003–04 season of Polly Umrigar\
      \ Trophy, Kohli was appointed the captain of the U-15 team.[22] He scored 54\
      \ runs in Delhi's victory over Himachal Pradesh. In the next fixture against\
      \ Jammu and Kashmir, Kohli scored his maiden century with a score of 119. By\
      \ the end of the season, he had a total of 390 runs at an average of 78, which\
      \ included two centuries.[23] Towards the end of 2004, Kohli earned selection\
      \ for the 2004–05 Vijay Merchant Trophy with the Delhi U-17 team.[22] In the\
      \ four matches that he played, Kohli had a total of 470 runs, with his highest\
      \ score being 251* runs. The team's coach, Ajit Chaudhary, lauded his performance\
      \ and was particularly impressed with his temperament on the field.[24] He commenced\
      \ the 2005–06 season with a score of 227 against Punjab. Following their victory\
      \ over Uttar Pradesh in the quarter-finals, Delhi was scheduled to play against\
      \ Baroda in the semi-finals. The team had high expectations from Kohli, who\
      \ had promised his coach to finish the job. True to his word, Kohli went on\
      \ to score 228 runs, leading Delhi to victory. The team later secured the tournament\
      \ with a five-wicket win over Mumbai, where he contributed with a half-century\
      \ in the first innings.[25] He ended as the highest run-scorer with a total\
      \ of 757 runs from 7 matches, averaging 84.11.[26]\n\nOn 18 February 2006, Kohli\
      \ made his debut in List A cricket, playing against Services in the Ranji One-Day\
      \ Trophy, but he did not get the opportunity to bat during the match.[26] In\
      \ 2006, Kohli got a spot in the state senior team. Subsequently, he made his\
      \ first-class debut on 23 November 2006, during the opening match of the Ranji\
      \ Trophy season against Tamil Nadu. However, his debut innings was a brief one,\
      \ as he was dismissed after scoring ten runs.[27] In the subsequent match against\
      \ former champions, Karnataka, Delhi found themselves trailing with a score\
      \ of 130/5, with Kohli remaining unbeaten on 40 at the end of the day's play.\
      \ That night, Kohli's father died. Despite the heart-wrenching news, Kohli returned\
      \ to the match and continued to bat and scored 90 runs before he was dismissed.[28]\
      \ Chetan Chauhan, the coach, was impressed by his determination and unwavering\
      \ attitude in the face of adversity. Venkatesh Prasad lauded his crucial knock,\
      \ which was executed in the midst of an emotional upheaval. After his dismissal,\
      \ Kohli attended his father's funeral. His innings proved to be crucial for\
      \ Delhi as they were able to avoid the follow-on. The team's captain, Mithun\
      \ Manhas, praised Kohli for his performance, acknowledging its pivotal role\
      \ in the team's success.[29]\n\nKohli's foray into T20 cricket first happened\
      \ in April 2007, during the Inter-State T20 Championship, where he emerged as\
      \ the top run-getter for his team with a tally of 179 runs at an average of\
      \ 35.80.[30] In Sep 2008, Kohli played in Nissar Trophy against SNGPL. He emerged\
      \ as the leading scorer for Delhi in both innings, registering 52 runs in the\
      \ first innings and a towering 197 in the second. The match ultimately ended\
      \ in a draw, SNGPL being declared the victors due to their lead in first innings.[31]\
      \ In the 2009–10 Ranji Trophy season, Kohli returned to domestic cricket. During\
      \ a match against Maharashtra, he opened the batting and scored 67 runs, helping\
      \ Delhi to secure the bonus point required for victory.[32] Kohli's performance\
      \ reinvigorated the competitive spirit of the domestic cricket circuit.\n\n\
      India U19 team\n\nIn July 2006, Kohli was selected in the India Under-19 squad\
      \ on its tour of England. He averaged 105 in the three-match ODI series against\
      \ England Under-19s, while also averaging 49 in the 3-match Test series. Following\
      \ India U-19 success in both the ODI and Test series, the team's coach Lalchand\
      \ Rajput noted Kohli's ad\n... (truncated, 89007 total chars)"
