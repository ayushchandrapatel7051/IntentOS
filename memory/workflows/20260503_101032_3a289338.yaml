        \ 10% of his economic rights and the player also extended his link until 30\
        \ June 2014.[9]\n\nIn 2010–11, Rolando rarely missed a game for Porto who\
        \ won another national championship. On 17 February 2011 he opened the score\
        \ at Sevilla FC through a header, in an eventual 2–1 win in the round of 32\
        \ of the UEFA Europa League,[10] which ended in conquest.[11]\n\nRolando started\
        \ 2011–12 in scoring fashion, netting both goals in the Portuguese Supercup,\
        \ a 2–1 victory over Vitória S.C. in Aveiro.[12] On 30 January 2013, completely\
        \ ostracised by manager Vítor Pereira as practically all Portuguese players,\
        \ he was transferred to SSC Napoli of the Serie A, being loaned until June.[13]\n\
        \nOn 10 August 2013, Inter Milan confirmed the signing of Rolando in a season-long\
        \ loan, for €600,000.[14][15] He scored his first goal for the side on 27\
        \ October, contributing to a 4–2 home defeat of Hellas Verona FC.[16]\n\n\
        In February 2015, after spending the first half of the new campaign ousted\
        \ from the squad due to a run-in with the board of directors after he refused\
        \ to join the team's pre-season,[17][18] Rolando was loaned to R.S.C. Anderlecht\
        \ until June.[19]\n\nMarseille[edit]\n\nOn 1 September 2015, Rolando was signed\
        \ by Olympique de Marseille.[20] His playtime was initially cut short, as\
        \ the replacement to head coach Marcelo Bielsa, Míchel, saw little use in\
        \ him, and was eventually transfer listed by Franck Passi after his first\
        \ season in France.[21]\n\nHowever, Rolando returned to the squad under the\
        \ newly appointed Rudi Garcia,[22] becoming an integral part of the team's\
        \ defense[23] and notably contributing to a 0–0 away draw to title holders\
        \ Paris Saint-Germain FC.[24] On 3 May 2018, brought from the bench for Morgan\
        \ Sanson in extra time, he scored in the dying minutes of the Europa League\
        \ semi-finals against FC Red Bull Salzburg for a 2–1 away loss and 3–2 aggregate\
        \ win.[25]\n\nBraga[edit]\n\nRolando returned to his country of adoption on\
        \ 27 February 2020, with the 34-year-old free agent joining S.C. Braga – coached\
        \ by his former Belenenses teammate Ruben Amorim – on a two-and-a-half-year\
        \ contract.[26] He finished 2020–21 as a cup winner, scoring the opening goal\
        \ of a 5–0 home win over S.C.U. Torreense in the last 16.[27]\n\nBraga sought\
        \ to offload Rolando before the 2021–22 season, but he turned down all available\
        \ offers due to his high wage demands. He was completely frozen out by manager\
        \ Carlos Carvalhal for the last year of his contract, despite long-term injuries\
        \ to David Carmo and Nuno Sequeira in the backline.[28]\n\nRolando left the\
        \ Estádio Municipal de Braga in July 2022, with only 16 competitive appearances\
        \ to his credit.[29]\n\nInternational career[edit]\nRolando (right) playing\
        \ against Argentina in February 2011.\n\nAlthough born in Cape Verde, Rolando\
        \ moved to Portugal aged 14 and became a naturalised citizen in 2006. He immediately\
        \ started playing for the nation's under-21s, for whom he appeared at the\
        \ 2006[30] and 2007 UEFA European Championships.[31]\n\nOn 11 February 2009,\
        \ Rolando was first called up to the full side, playing 90 minutes in a friendly\
        \ match with Finland in Faro (1–0 win).[32] He was selected for the 2010 FIFA\
        \ World Cup in South Africa,[33] but did not leave the bench.\n\nAt UEFA Euro\
        \ 2012, Rolando made three appearances for the semi-finalists, all as a late\
        \ substitute.[34][35][36] After a four-year international absence, he returned\
        \ to the international fold for a friendly against Egypt in March 2018.[37]\
        \ He was named in a preliminary 35-man squad for the year's World Cup weeks\
        \ later,[38] but did not make the final cut.[39]\n\nCareer statistics[edit]\n\
